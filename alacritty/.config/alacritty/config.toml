[general]
  import = ["~/.cache/wal/colors.toml"]
  live_config_reload = true

[env]
  TERM = "xterm-256color"

[window]
  dynamic_padding = true
  opacity = 0.9
  blur = true

[window.padding]
  x = 5
  y = 5

[font]
  size = 12.5

[font.normal]
  family = "JetBrainsMono Nerd Font"
  style = "Regular"

[font.bold]
  family = "JetBrainsMono Nerd Font"

[font.italic]
  family = "JetBrainsMono Nerd Font"

[selection]
  semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
  save_to_clipboard = false

[[keyboard.bindings]]
  action = "ResetFontSize"
  key = "Key0"
  mods = "Command"

[[keyboard.bindings]]
  action = "IncreaseFontSize"
  key = "Equals"
  mods = "Command"

[[keyboard.bindings]]
  action = "DecreaseFontSize"
  key = "Minus"
  mods = "Command"

[cursor.style]
  shape = "Block"
  blinking = "On"

